<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BMI & Health Calculator - ToolKit Pro</title><meta name="description" content="Free BMI, BMR, and ideal weight calculator.">
<style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#07070d;color:#e0e0e0;margin:0;padding:20px}.container{max-width:700px;margin:0 auto}a{color:#ff7043}.back{color:#888;text-decoration:none;display:block;margin-bottom:12px}h1{color:#fff;font-size:1.8rem}.card{background:#0d0d1a;border:1px solid #1a1a2e;border-radius:12px;padding:24px;margin:16px 0}.card h2{color:#fff;font-size:1.1rem;margin-bottom:12px}label{color:#888;display:block;margin:8px 0 4px;font-size:0.9rem}input{width:100%;padding:10px 14px;border:1px solid #1a1a2e;border-radius:8px;background:#07070d;color:#fff;font-size:0.95rem;margin:4px 0}input:focus{outline:none;border-color:#ff7043}select{padding:10px 14px;border:1px solid #1a1a2e;border-radius:8px;background:#07070d;color:#fff;width:100%}.row{display:flex;gap:12px}.row>div{flex:1}.btn{background:#ff7043;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-weight:600;cursor:pointer;margin-top:12px;width:100%}.rb{background:#0d0d1a;border:1px solid #1a1a2e;border-radius:8px;padding:16px;margin-top:12px;text-align:center;display:none}.rb .big{font-size:2.2rem;font-weight:700;color:#ff7043}.rb .desc{color:#4caf50;font-weight:600;margin-top:6px}.kofi{text-align:center;margin-top:40px;color:#555;font-size:0.85rem}@media(max-width:600px){.row{flex-direction:column}}</style></head>
<body><div class="container">
<a href="../index.html" class="back">← Back to ToolKit Pro</a>
<h1>BMI & Health Calculator</h1>
<p style="color:#888;">Calculate your BMI, BMR, and ideal weight range.</p>
<div class="card">
  <h2>Body Mass Index (BMI)</h2>
  <div class="row"><div><label>Weight (kg)</label><input type="number" id="bmiw" value="75"></div><div><label>Height (cm)</label><input type="number" id="bmih" value="175"></div></div>
  <button class="btn" onclick="calcBMI()">Calculate</button>
  <div class="rb" id="bmir"><div class="big" id="bmiv">22.9</div><div class="desc" id="bmic">Normal weight</div></div>
</div>
<div class="card">
  <h2>Basal Metabolic Rate (BMR)</h2>
  <div class="row"><div><label>Age</label><input type="number" id="bmrage" value="30"></div><div><label>Gender</label><select id="bmrg"><option value="male">Male</option><option value="female">Female</option></select></div></div>
  <div class="row"><div><label>Weight (kg)</label><input type="number" id="bmrw" value="75"></div></div>
  <button class="btn" onclick="calcBMR()">Calculate</button>
  <div class="rb" id="bmrr"><div class="big" id="bmrv">1,685</div><div class="desc">Calories per day</div></div>
</div>
<div class="card">
  <h2>Ideal Weight Range</h2>
  <div class="row"><div><label>Height (cm)</label><input type="number" id="iw" value="175"></div></div>
  <button class="btn" onclick="calcIW()">Calculate</button>
  <div class="rb" id="iwr"><div class="big" id="iwv">66 - 80 kg</div></div>
</div>
<div class="kofi">A <a href="https://ko-fi.com/hossamhassan86778">Ko-fi</a> supported tool</div>
</div>
<script>
function calcBMI(){const w=parseFloat(document.getElementById('bmiw').value),h=parseFloat(document.getElementById('bmih').value)/100;if(!w||!h)return;const b=w/(h*h);document.getElementById('bmiv').textContent=b.toFixed(1);document.getElementById('bmir').style.display='block';const c=document.getElementById('bmic');if(b<18.5)c.textContent='Underweight';else if(b<25)c.textContent='Normal weight';else if(b<30)c.textContent='Overweight';else if(b<35)c.textContent='Obese Class I';else if(b<40)c.textContent='Obese Class II';else c.textContent='Obese Class III'}
function calcBMR(){const w=parseFloat(document.getElementById('bmrw').value),a=parseInt(document.getElementById('bmrage').value),g=document.getElementById('bmrg').value,h=175;if(!w||!a)return;const b=g==='male'?88.362+(13.397*w)+(4.799*h)-(5.677*a):447.593+(9.247*w)+(3.098*h)-(4.33*a);document.getElementById('bmrv').textContent=Math.round(b).toLocaleString();document.getElementById('bmrr').style.display='block'}
function calcIW(){const h=parseFloat(document.getElementById('iw').value);if(!h)return;const m=h/100;document.getElementById('iwv').textContent=Math.round(18.5*m*m)+' - '+Math.round(25*m*m)+' kg';document.getElementById('iwr').style.display='block'}
calcBMI();calcBMR();calcIW();
</script></body></html>
