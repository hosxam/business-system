<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>QR Code Generator - ToolKit Pro</title><meta name="description" content="Generate QR codes for URLs, text, WiFi networks, and vCards. Free.">
<style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#07070d;color:#e0e0e0;margin:0;padding:20px}.container{max-width:700px;margin:0 auto}a{color:#ff7043}.back{color:#888;text-decoration:none;display:block;margin-bottom:20px;font-size:0.9rem}h1{color:#fff;font-size:1.8rem}.tabs{display:flex;gap:8px;margin:20px 0}.tab{padding:10px 20px;background:#0d0d1a;border:1px solid #1a1a2e;border-radius:8px;color:#888;cursor:pointer;font-size:0.85rem}.tab.active{background:#1a1a1a;border-color:#ff7043;color:#ff7043;font-weight:600}.tc{display:none}.tc.active{display:block}input,textarea{width:100%;padding:12px 16px;border:1px solid #1a1a2e;border-radius:8px;background:#07070d;color:#fff;font-size:0.95rem;margin:8px 0;font-family:inherit}input:focus,textarea:focus{outline:none;border-color:#ff7043}select{width:100%;padding:12px;background:#07070d;border:1px solid #1a1a2e;border-radius:8px;color:#fff;margin:8px 0}.btn{background:#ff7043;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-weight:600;cursor:pointer;margin-top:12px}.result{text-align:center;margin-top:24px;padding:20px;background:#0d0d1a;border-radius:12px;display:none}.kofi{text-align:center;margin-top:30px;color:#555;font-size:0.85rem}</style>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body><div class="container">
<a href="../index.html" class="back">← Back to ToolKit Pro</a>
<h1>QR Code Generator</h1>
<p style="color:#888;">Generate QR codes for URLs, text, WiFi networks, and vCards.</p>
<div class="tabs">
  <div class="tab active" data-tab="url">URL</div>
  <div class="tab" data-tab="text">Text</div>
  <div class="tab" data-tab="wifi">WiFi</div>
  <div class="tab" data-tab="vcard">vCard</div>
</div>
<div class="tc active" id="tu"><input type="url" id="url-input" placeholder="https://example.com"><button class="btn" onclick="genQR(document.getElementById('url-input').value)">Generate</button></div>
<div class="tc" id="tt"><textarea id="text-input" rows="4" placeholder="Enter text..."></textarea><button class="btn" onclick="genQR(document.getElementById('text-input').value)">Generate</button></div>
<div class="tc" id="tw"><input type="text" id="wifi-ssid" placeholder="Network name"><input type="text" id="wifi-pass" placeholder="Password"><select id="wifi-enc"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option><option value="">None</option></select><button class="btn" onclick="genWifi()">Generate</button></div>
<div class="tc" id="tv"><input type="text" id="vcard-name" placeholder="Full name"><input type="tel" id="vcard-phone" placeholder="Phone"><input type="email" id="vcard-email" placeholder="Email"><button class="btn" onclick="genVcard()">Generate</button></div>
<div class="result" id="result"><div id="qrcode"></div><button class="btn" id="dlBtn">Download PNG</button></div>
<div style="color:#888;text-align:center;margin-top:16px;font-size:0.85rem" id="status">Enter data above</div>
<div class="kofi">Like this tool? <a href="https://ko-fi.com/hossamhassan86778/shop">Support on Ko-fi</a></div>
</div>
<script>
let qr=null;
document.querySelectorAll('.tab').forEach(t=>{t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tc').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById('t'+t.dataset.tab).classList.add('active')}});
function genQR(d){if(!d||!d.trim()){document.getElementById('status').textContent='Enter data';return}const r=document.getElementById('result');r.style.display='block';document.getElementById('qrcode').innerHTML='';qr=new QRCode(document.getElementById('qrcode'),{text:d,width:256,height:256,colorDark:'#ff7043',colorLight:'#0d0d1a'});document.getElementById('status').textContent='QR code generated!'}
document.getElementById('dlBtn').onclick=()=>{const img=document.querySelector('#qrcode img');if(img){const a=document.createElement('a');a.href=img.src;a.download='qrcode.png';a.click()}};
function genWifi(){const s=document.getElementById('wifi-ssid').value,p=document.getElementById('wifi-pass').value,e=document.getElementById('wifi-enc').value;if(!s){document.getElementById('status').textContent='Enter network name';return}genQR('WIFI:S:'+s+';T:'+e+';P:'+p+';;')}
function genVcard(){const n=document.getElementById('vcard-name').value,p=document.getElementById('vcard-phone').value,e=document.getElementById('vcard-email').value;if(!n){document.getElementById('status').textContent='Enter name';return}genQR('BEGIN:VCARD\nVERSION:3.0\nFN:'+n+'\nTEL:'+p+'\nEMAIL:'+e+'\nEND:VCARD')}
</script></body></html>
