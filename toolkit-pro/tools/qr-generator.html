<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator — TOOLKIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800;900&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;box-sizing:border-box}
    :root{--bg:#fafaf8;--card:#f2f2ee;--ink:#141413;--ink-2:#6b6b63;--border:#d4d4cc;--accent:#d84c2c;--accent-bg:#f1dfd9}
    body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
    .top-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;border-bottom:2px solid var(--ink)}
    .top-bar .wordmark{font-family:'Red Hat Display',sans-serif;font-weight:900;font-size:1.2rem;letter-spacing:-0.5px;text-transform:uppercase}
    .top-bar .wordmark span{color:var(--accent)}
    .top-bar a{color:var(--ink-2);text-decoration:none;font-size:0.8rem;font-weight:500;transition:color 0.15s}
    .top-bar a:hover{color:var(--accent)}

    .tool-area{max-width:640px;margin:40px auto;padding:0 28px}
    .tool-header{margin-bottom:24px}
    .tool-header .bread{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-2);margin-bottom:8px}
    .tool-header h1{font-family:'Red Hat Display',sans-serif;font-weight:900;font-size:1.6rem;letter-spacing:-0.02em}
    .tool-header p{font-size:0.85rem;color:var(--ink-2);margin-top:4px}

    .card{background:var(--card);border:1px solid var(--border);padding:32px;margin-bottom:16px}
    .field-group{margin-bottom:20px}
    .field-group label{display:block;font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px}
    .field-group select,.field-group input[type="text"]{width:100%;padding:10px 12px;border:1px solid var(--border);background:var(--bg);font-family:'DM Sans',sans-serif;font-size:0.9rem;color:var(--ink);outline:none}
    .field-group select:focus,.field-group input:focus{border-color:var(--ink)}
    .field-group textarea{width:100%;padding:10px 12px;border:1px solid var(--border);background:var(--bg);font-family:'DM Sans',sans-serif;font-size:0.9rem;color:var(--ink);min-height:80px;resize:vertical;outline:none}
    .field-group textarea:focus{border-color:var(--ink)}

    .btn{display:inline-block;padding:12px 28px;background:var(--ink);color:var(--bg);border:none;font-family:'DM Sans',sans-serif;font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;cursor:pointer;transition:background 0.15s}
    .btn:hover{background:var(--accent)}
    .btn:disabled{opacity:0.4;cursor:not-allowed}
    .btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

    .output-area{margin-top:20px;text-align:center;min-height:100px}
    .output-area canvas{max-width:100%}
    .output-area img{max-width:280px;border:1px solid var(--border}}

    .back-link{display:inline-block;margin-top:8px;font-size:0.75rem;color:var(--ink-2);text-underline-offset:2px}

    footer{padding:28px;text-align:center;font-size:0.75rem;color:var(--ink-2);border-top:1px solid var(--border);margin-top:40px}
    footer a{color:var(--ink);text-underline-offset:2px}
  </style>
</head>
<body>
<div class="top-bar">
  <div class="wordmark"><span>//</span> TOOLKIT</div>
  <a href="https://ko-fi.com/hossamhassan86778">support on ko-fi</a>
</div>

<div class="tool-area">
  <div class="tool-header">
    <div class="bread"><a href="../index.html" style="color:var(--ink-2);text-underline-offset:2px">&larr; All Tools</a> / QR Generator</div>
    <h1>QR Code Generator</h1>
    <p>Generate QR codes for URLs, text, WiFi networks, and vCards. All runs in your browser.</p>
  </div>

  <div class="card">
    <div class="field-group">
      <label for="type">Type</label>
      <select id="type">
        <option value="url">URL</option>
        <option value="text">Plain Text</option>
        <option value="wifi">WiFi Network</option>
        <option value="vcard">vCard (Contact)</option>
      </select>
    </div>
    <div class="field-group" id="input-group">
      <label for="input">URL</label>
      <input type="text" id="input" placeholder="https://example.com" value="https://ko-fi.com/hossamhassan86778">
    </div>
    <div class="field-group" id="extra-fields" style="display:none">
      <div style="margin-bottom:12px">
        <label for="wifi-ssid">Network Name (SSID)</label>
        <input type="text" id="wifi-ssid" placeholder="My WiFi">
      </div>
      <div style="margin-bottom:12px">
        <label for="wifi-password">Password</label>
        <input type="text" id="wifi-password" placeholder="password">
      </div>
      <div>
        <label for="wifi-encryption">Encryption</label>
        <select id="wifi-encryption"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option><option value="">None</option></select>
      </div>
    </div>
    <div id="vcard-fields" style="display:none">
      <div style="margin-bottom:12px"><label>Full Name</label><input type="text" id="vc-name" placeholder="John Doe" class="field" style="width:100%;padding:10px 12px;border:1px solid var(--border);background:var(--bg);font-size:0.9rem;outline:none"></div>
      <div style="margin-bottom:12px"><label>Phone</label><input type="text" id="vc-phone" placeholder="+1234567890" class="field" style="width:100%;padding:10px 12px;border:1px solid var(--border);background:var(--bg);font-size:0.9rem;outline:none"></div>
      <div style="margin-bottom:12px"><label>Email</label><input type="text" id="vc-email" placeholder="john@example.com" class="field" style="width:100%;padding:10px 12px;border:1px solid var(--border);background:var(--bg);font-size:0.9rem;outline:none"></div>
    </div>
    <div class="btn-group">
      <button class="btn" id="generate-btn">Generate QR Code</button>
      <button class="btn" id="download-btn" style="background:transparent;color:var(--ink);border:1px solid var(--border)" disabled>Download PNG</button>
    </div>
    <div class="output-area" id="output"></div>
  </div>

  <a href="../index.html" class="back-link">&larr; Back to all tools</a>
</div>

<footer>
  <p>TOOLKIT by Dr. Hossam Hassan &middot; All processing is local, nothing is uploaded</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
  let currentQR = null;
  const typeEl = document.getElementById('type');
  const inputGroup = document.getElementById('input-group');
  const inputEl = document.getElementById('input');
  const extraFields = document.getElementById('extra-fields');
  const vcardFields = document.getElementById('vcard-fields');
  const output = document.getElementById('output');
  const genBtn = document.getElementById('generate-btn');
  const dlBtn = document.getElementById('download-btn');

  typeEl.addEventListener('change', () => {
    extraFields.style.display = typeEl.value === 'wifi' ? 'block' : 'none';
    vcardFields.style.display = typeEl.value === 'vcard' ? 'block' : 'none';
    if (typeEl.value === 'url') { inputGroup.style.display = 'block'; inputEl.placeholder = 'https://example.com'; inputEl.value = 'https://ko-fi.com/hossamhassan86778'; }
    else if (typeEl.value === 'text') { inputGroup.style.display = 'block'; inputEl.placeholder = 'Enter your text...'; inputEl.value = ''; }
    else { inputGroup.style.display = 'none'; }
    output.innerHTML = ''; currentQR = null; dlBtn.disabled = true;
  });

  genBtn.addEventListener('click', () => {
    let data = '';
    switch (typeEl.value) {
      case 'url': case 'text': data = inputEl.value; break;
      case 'wifi': {
        const ssid = document.getElementById('wifi-ssid').value;
        const pw = document.getElementById('wifi-password').value;
        const enc = document.getElementById('wifi-encryption').value;
        data = enc ? 'WIFI:T:' + enc + ';S:' + ssid + ';P:' + pw + ';;' : 'WIFI:S:' + ssid + ';P:' + pw + ';;';
        break;
      }
      case 'vcard': {
        const n = document.getElementById('vc-name').value;
        const p = document.getElementById('vc-phone').value;
        const e = document.getElementById('vc-email').value;
        data = 'BEGIN:VCARD\nVERSION:3.0\nFN:' + n + '\nTEL:' + p + '\nEMAIL:' + e + '\nEND:VCARD';
        break;
      }
    }
    if (!data) return;
    output.innerHTML = '';
    currentQR = new QRCode(output, { text: data, width: 280, height: 280, colorDark: '#141413', colorLight: '#fafaf8' });
    dlBtn.disabled = false;
  });

  dlBtn.addEventListener('click', () => {
    const canvas = output.querySelector('canvas');
    if (!canvas) return;
    const link = document.createElement('a');
    link.download = 'qrcode.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
</script>
</body>
</html>
