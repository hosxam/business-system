<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Markdown Editor - ToolKit Pro</title><meta name="description" content="Free online Markdown editor with live preview and HTML export.">
<style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#07070d;color:#e0e0e0;margin:0;padding:20px;height:100vh;display:flex;flex-direction:column}.container{max-width:1100px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}a{color:#ff7043}.back{color:#888;text-decoration:none;font-size:0.9rem;display:block;margin-bottom:8px}h1{color:#fff;font-size:1.8rem;margin-bottom:4px}.ew{display:flex;gap:16px;flex:1;min-height:0}textarea{flex:1;background:#0d0d1a;border:1px solid #1a1a2e;border-radius:12px;padding:16px;color:#fff;font-size:0.95rem;font-family:monospace;resize:none}textarea:focus{outline:none;border-color:#ff7043}.pv{flex:1;background:#0d0d1a;border:1px solid #1a1a2e;border-radius:12px;padding:16px;overflow-y:auto;line-height:1.6}.pv h1,.pv h2,.pv h3{color:#fff;margin:12px 0 6px}.pv p{color:#ccc;margin:6px 0}.pv code{background:#1a1a2e;padding:2px 6px;border-radius:4px;color:#ff7043}.pv pre{background:#07070d;padding:16px;border-radius:8px;overflow-x:auto}.pv ul,.pv ol{padding-left:24px;color:#ccc}.pv blockquote{border-left:3px solid #ff7043;padding-left:16px;color:#888}.tb{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.tbtn{background:#0d0d1a;border:1px solid #1a1a2e;border-radius:6px;color:#888;padding:5px 10px;cursor:pointer;font-size:0.75rem}.tbtn:hover{border-color:#ff7043;color:#ff7043}.kofi{text-align:center;color:#555;font-size:0.8rem;padding:12px 0}@media(max-width:768px){.ew{flex-direction:column}}</style></head>
<body><div class="container">
<a href="../index.html" class="back">← Back to ToolKit Pro</a>
<h1>Markdown Editor</h1>
<div class="tb">
  <button class="tbtn" onclick="w('**','**')">Bold</button>
  <button class="tbtn" onclick="w('*','*')">Italic</button>
  <button class="tbtn" onclick="w('[','](url)')">Link</button>
  <button class="tbtn" onclick="w('``','``')">Code</button>
  <button class="tbtn" onclick="ins('> ')">Quote</button>
  <button class="tbtn" onclick="ins('# ')">H1</button>
  <button class="tbtn" onclick="ins('## ')">H2</button>
  <button class="tbtn" onclick="ins('- ')">List</button>
</div>
<div class="ew">
<textarea id="ed"># Welcome

Start writing **Markdown** here.

Try headings, **bold**, *italic*, `code`, and more.

> Blockquote example

- List item 1
- List item 2</textarea>
<div class="pv" id="pv"></div>
</div>
<div class="kofi">A <a href="https://ko-fi.com/hossamhassan86778">Ko-fi</a> supported tool</div>
</div>
<script>
const ed=document.getElementById('ed'),pv=document.getElementById('pv');
function render(){
  let m=ed.value;
  m=m.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  m=m.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  m=m.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  m=m.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  m=m.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  m=m.replace(/\*(.+?)\*/g,'<em>$1</em>');
  m=m.replace(/\`\`\`(\w*)\n?([\s\S]*?)\`\`\`/g,'<pre><code>$2</code></pre>');
  m=m.replace(/\`(.+?)\`/g,'<code>$1</code>');
  m=m.replace(/!\[(.*?)\]\((.*?)\)/g,'<img src="$2" alt="$1" style="max-width:100%">');
  m=m.replace(/\[(.+?)\]\((.*?)\)/g,'<a href="$2" style="color:#ff7043">$1</a>');
  m=m.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');
  m=m.replace(/^- (.+)$/gm,'<li>$1</li>');
  m=m.replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>').replace(/<\/ul>\s*<ul>/g,'');
  m=m.replace(/^(\d+)\. (.+)$/gm,'<li>$2</li>');
  m=m.split('\n\n').map(p=>p.trim()?'<p>'+p+'</p>':'').join('');
  pv.innerHTML=m;
}
ed.addEventListener('input',render);render();
function w(b,e){const s=ed.selectionStart,en=ed.selectionEnd;const sel=ed.value.substring(s,en);ed.value=ed.value.substring(0,s)+b+sel+e+ed.value.substring(en);ed.focus();render()}
function ins(t){const p=ed.selectionStart;ed.value=ed.value.substring(0,p)+t+ed.value.substring(ed.selectionEnd);ed.focus();render()}
</script></body></html>
