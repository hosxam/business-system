  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Resizer — TOOLKIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;box-sizing:border-box}
    :root{--bg:#fafaf8;--card:#f2f2ee;--ink:#141413;--ink-2:#6b6b63;--border:#d4d4cc;--accent:#d84c2c}
    body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
    .top-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;border-bottom:2px solid var(--ink)}
    .top-bar .wordmark{font-family:'Red Hat Display',sans-serif;font-weight:900;font-size:1.2rem;letter-spacing:-0.5px;text-transform:uppercase}
    .top-bar .wordmark span{color:var(--accent)}
    .top-bar a{color:var(--ink-2);text-decoration:none;font-size:0.8rem;font-weight:500}
    .top-bar a:hover{color:var(--accent)}
    .tool-area{max-width:640px;margin:40px auto;padding:0 28px}
    .tool-header{margin-bottom:24px}
    .tool-header .bread{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-2);margin-bottom:8px}
    .tool-header .bread a{color:var(--ink-2);text-underline-offset:2px}
    .tool-header h1{font-family:'Red Hat Display',sans-serif;font-weight:900;font-size:1.6rem;letter-spacing:-0.02em}
    .tool-header p{font-size:0.85rem;color:var(--ink-2);margin-top:4px}
    .card{background:var(--card);border:1px solid var(--border);padding:32px;margin-bottom:16px}
    .field-group{margin-bottom:20px}
    .field-group label{display:block;font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px}
    .field-group input[type="file"],.field-group input[type="number"]{width:100%;padding:10px 12px;border:1px solid var(--border);background:var(--bg);font-family:'DM Sans',sans-serif;font-size:0.9rem;color:var(--ink);outline:none}
    .field-group input[type="file"]{padding:8px 12px}
    .field-row{display:flex;gap:12px}
    .field-row .field-group{flex:1}
    .btn{display:inline-block;padding:12px 28px;background:var(--ink);color:var(--bg);border:none;font-family:'DM Sans',sans-serif;font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;cursor:pointer;transition:background 0.15s}
    .btn:hover{background:var(--accent)}
    .btn:disabled{opacity:0.4;cursor:not-allowed}
    .btn-group{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
    .output-area{margin-top:20px;text-align:center;min-height:60px}
    .output-area img{max-width:100%;border:1px solid var(--border)}
    .back-link{display:inline-block;margin-top:8px;font-size:0.75rem;color:var(--ink-2);text-underline-offset:2px}
    footer{padding:28px;text-align:center;font-size:0.75rem;color:var(--ink-2);border-top:1px solid var(--border);margin-top:40px}
    footer a{color:var(--ink);text-underline-offset:2px}
  </style>
</head>
<body>
<div class="top-bar">
  <div class="wordmark"><span>//</span> TOOLKIT</div>
  <a href="https://ko-fi.com/hossamhassan86778">support on ko-fi</a>
</div>
<div class="tool-area">
  <div class="tool-header">
    <div class="bread"><a href="../index.html">&larr; All Tools</a> / Image Resizer</div>
    <h1>Image Resizer</h1>
    <p>Resize, compress, and convert images. All processing stays in your browser.</p>
  </div>
  <div class="card">
    <div class="field-group">
      <label for="upload">Upload Image</label>
      <input type="file" id="upload" accept="image/*">
    </div>
    <div class="field-row">
      <div class="field-group"><label for="width">Width (px)</label><input type="number" id="width" value="800" min="1"></div>
      <div class="field-group"><label for="height">Height (px)</label><input type="number" id="height" value="600" min="1"></div>
    </div>
    <div class="field-group">
      <label for="quality">Quality (%)</label>
      <input type="number" id="quality" value="90" min="1" max="100">
    </div>
    <div class="field-group">
      <label for="format">Format</label>
      <select id="format" style="width:100%;padding:10px 12px;border:1px solid var(--border);background:var(--bg);font-family:'DM Sans',sans-serif;font-size:0.9rem;outline:none">
        <option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option>
      </select>
    </div>
    <div class="btn-group">
      <button class="btn" id="resize-btn" disabled>Resize</button>
      <button class="btn" id="download-btn" style="background:transparent;color:var(--ink);border:1px solid var(--border)" disabled>Download</button>
    </div>
    <div class="output-area" id="output"></div>
  </div>
  <a href="../index.html" class="back-link">&larr; Back to all tools</a>
</div>
<footer><p>TOOLKIT by Dr. Hossam Hassan</p></footer>
<script>
  let resizedBlob = null;
  const upload = document.getElementById('upload');
  const widthEl = document.getElementById('width');
  const heightEl = document.getElementById('height');
  const qualityEl = document.getElementById('quality');
  const formatEl = document.getElementById('format');
  const resizeBtn = document.getElementById('resize-btn');
  const downloadBtn = document.getElementById('download-btn');
  const output = document.getElementById('output');

  let img = null;
  upload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      img = new Image();
      img.onload = () => {
        widthEl.value = img.naturalWidth;
        heightEl.value = img.naturalHeight;
        resizeBtn.disabled = false;
        output.innerHTML = '<img src="' + ev.target.result + '" style="max-width:240px">';
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  resizeBtn.addEventListener('click', () => {
    if (!img) return;
    const canvas = document.createElement('canvas');
    canvas.width = parseInt(widthEl.value) || img.naturalWidth;
    canvas.height = parseInt(heightEl.value) || img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    canvas.toBlob((blob) => {
      resizedBlob = blob;
      const url = URL.createObjectURL(blob);
      output.innerHTML = '<img src="' + url + '" style="max-width:320px"><p style="font-size:0.75rem;margin-top:6px;color:var(--ink-2)">' + Math.round(blob.size/1024) + ' KB</p>';
      downloadBtn.disabled = false;
    }, formatEl.value, parseInt(qualityEl.value) / 100);
  });

  downloadBtn.addEventListener('click', () => {
    if (!resizedBlob) return;
    const link = document.createElement('a');
    link.download = 'resized.' + formatEl.value.split('/')[1];
    link.href = URL.createObjectURL(resizedBlob);
    link.click();
  });
</script>
</body>
</html>
