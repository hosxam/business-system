<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Image Resizer - ToolKit Pro</title><meta name="description" content="Free online image resizer. Resize, compress, and convert images in your browser.">
<style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#07070d;color:#e0e0e0;margin:0;padding:20px}.container{max-width:700px;margin:0 auto}a{color:#ff7043}.back{color:#888;text-decoration:none;display:block;margin-bottom:12px}h1{color:#fff;font-size:1.8rem}.dz{border:2px dashed #333;border-radius:12px;padding:50px 20px;text-align:center;margin:16px 0;cursor:pointer}.dz:hover{border-color:#ff7043}.dz p{color:#888}.ct{background:#0d0d1a;border:1px solid #1a1a2e;border-radius:12px;padding:24px;display:none;margin:16px 0}.row{display:flex;gap:12px;margin:10px 0;align-items:center}.row label{color:#888;width:100px;font-size:0.9rem}.row input{flex:1;padding:8px 12px;border:1px solid #1a1a2e;border-radius:6px;background:#07070d;color:#fff}select{padding:8px 12px;border:1px solid #1a1a2e;border-radius:6px;background:#07070d;color:#fff}.btn{background:#ff7043;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-weight:600;cursor:pointer;width:100%;margin-top:12px}#preview{max-width:100%;margin-top:16px;border-radius:8px;display:none}.kofi{text-align:center;margin-top:40px;color:#555;font-size:0.85rem}</style></head>
<body><div class="container">
<a href="../index.html" class="back">← Back to ToolKit Pro</a>
<h1>Image Resizer</h1>
<p style="color:#888;">Resize, compress, and convert images. All processing happens in your browser. Nothing is uploaded.</p>
<div class="dz" id="dz"><p>Drop an image here or click to browse</p></div>
<input type="file" id="fi" accept="image/*" style="display:none">
<div class="ct" id="ct">
  <div class="row"><label>Width (px)</label><input type="number" id="w" value="800"></div>
  <div class="row"><label>Height (px)</label><input type="number" id="h" value="600"></div>
  <div class="row"><label>Format</label><select id="fmt"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div>
  <div class="row"><label>Quality</label><input type="number" id="q" value="80" min="1" max="100"></div>
  <button class="btn" id="rb">Resize & Download</button>
  <img id="pv">
</div>
<div style="color:#888;text-align:center;margin-top:16px;font-size:0.85rem" id="st">Drop an image to start</div>
<div class="kofi">Useful? <a href="https://ko-fi.com/hossamhassan86778/shop">Support on Ko-fi</a></div>
</div>
<script>
const dz=document.getElementById('dz'),fi=document.getElementById('fi'),ct=document.getElementById('ct'),w=document.getElementById('w'),h=document.getElementById('h'),fmt=document.getElementById('fmt'),q=document.getElementById('q'),rb=document.getElementById('rb'),pv=document.getElementById('pv'),st=document.getElementById('st');
let of=null;
dz.onclick=()=>fi.click();
fi.onchange=()=>{if(fi.files[0])load(fi.files[0])};
function load(f){of=f;const img=new Image();img.onload=()=>{w.value=img.naturalWidth;h.value=img.naturalHeight;ct.style.display='block';st.textContent=f.name+' loaded ('+img.naturalWidth+'x'+img.naturalHeight+')';pv.src=img.src;pv.style.display='block'};img.src=URL.createObjectURL(f)}
rb.onclick=()=>{if(!of)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=parseInt(w.value)||img.naturalWidth;c.height=parseInt(h.value)||img.naturalHeight;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='resized.'+(fmt.value==='image/png'?'png':fmt.value==='image/webp'?'webp':'jpg');a.click()},fmt.value,parseInt(q.value)/100)};img.src=URL.createObjectURL(of)};
</script></body></html>
